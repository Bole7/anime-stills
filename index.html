<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>近期日漫截图分享</title>
<meta name="description" content="近期日本动画截图分享站。环幕旋转查看精选画面，可按色调筛选，点击放大阅读字幕细节。">
<meta name="author" content="王博乐">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>

<a class="skip-link" href="#index">跳到截图目录</a>

<!-- ============================ 站点导航 ============================ -->
<header class="site-header intro intro-1" id="siteHeader">
  <div class="shell">
    <nav class="site-nav" aria-label="主导航">
      <a href="#stage">环幕</a>
      <a href="#index">目录</a>
      <a href="#about">关于</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ========================== 一、环幕轮播 ========================== -->
  <section class="stage" id="stage" aria-labelledby="siteTitle">
    <!-- 页面的标题只留给屏幕阅读器，画面上不落字 -->
    <h1 class="sr-only" id="siteTitle">近期日漫截图分享</h1>

    <div class="shell">

      <!-- 3D 圆柱环幕：面板由 JS 依数据注入 -->
      <div class="carousel intro intro-2 intro-fade" id="carousel"
           role="region" aria-roledescription="轮播"
           aria-label="近期动画截图环幕，可用方向键切换">
        <div class="carousel__ring" id="ring"></div>
      </div>

    </div>
  </section>

  <!-- =========================== 二、目录 =========================== -->
  <section class="index" id="index" aria-label="截图目录">
    <div class="shell">
      <div class="filters" id="filters" role="group" aria-label="按色调筛选"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>这个色调下暂时没有画面。</p>
    </div>
  </section>

  <!-- =========================== 三、关于 =========================== -->
  <section class="about" id="about" aria-labelledby="aboutTitle">
    <div class="shell">
      <p class="eyebrow reveal">About · 关于本站</p>

      <div class="about__body">
        <p class="about__lede reveal" id="aboutTitle">
          把喜欢的画面<em>停下来</em>。<br>
          一张一张地看，比连着看完一遍，更容易记很久。
        </p>

        <div class="about__cols reveal">
          <p>这里收的是近期在追的动画里按下的截图，以《电锯人》为主，混着几部同期作品。挑片子的标准只有一条：这一张单独拿出来，还立得住。</p>
          <p>页面主体是一圈会缓慢自转的环幕 —— 可以拖，可以滚，也可以用方向键一张一张翻。看到想细看的，点开就是原图。</p>

          <dl class="stats">
            <div>
              <dt>Stills</dt>
              <dd id="statCount">53</dd>
            </div>
            <div>
              <dt>Rotary</dt>
              <dd id="statHero">08</dd>
            </div>
            <div>
              <dt>Batches</dt>
              <dd>02</dd>
            </div>
          </dl>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ============================= 页脚 ============================= -->
<footer class="site-footer">
  <div class="shell">
    <span>个人截图收藏，仅作学习与作业展示</span>
    <span>HTML / CSS / JavaScript · <span id="year">2026</span></span>
  </div>
</footer>

<!-- ============================= 灯箱 ============================= -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <button class="lightbox__close" id="lbClose" type="button" aria-label="关闭查看">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" type="button" aria-label="上一张">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5l-7 7 7 7"/>
    </svg>
  </button>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" type="button" aria-label="下一张">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 5l7 7-7 7"/>
    </svg>
  </button>

  <div class="lightbox__inner">
    <img class="lightbox__img" id="lbImg" src="" alt="">
    <div class="lightbox__bar">
      <span><strong id="lbTitle">—</strong> <span id="lbLatin"></span></span>
      <span id="lbMeta"></span>
    </div>
  </div>
</div>

<script src="scripts/frames-data.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
